<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Banglish2Bangla</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    padding: 30px;
    background: #f5f5f5;
  }

  h2 {
    color: #333;
  }

  textarea {
    width: 85%;
    height: 120px;
    font-size: 18px;
    margin: 10px;
    padding: 10px;
  }

  button {
    padding: 10px 25px;
    font-size: 16px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
  }

  button:hover {
    background: #0056b3;
  }
</style>
</head>

<body>

<h2>Banglish to Bangla Typing Tool ⚡</h2>

<textarea id="input" placeholder="Type Banglish (ami tomake valobasi)"></textarea><br>

<button onclick="convert()">Convert</button><br>

<textarea id="output" placeholder="Bangla output will show here"></textarea>
<script>
let dict = {
  "ami": "আমি",
  "tumi": "তুমি",
  "tomake": "তোমাকে",
  "valo": "ভালো",
  "ase": "আছে",
  "valobasi": "ভালোবাসি",
  "bhalobasi": "ভালোবাসি",
  "koro": "করো",
  "khao": "খাও",
  "jai": "যাই",
  "bari": "বাড়ি"
};

let autoFix = {
  "tomaka": "tomake",
  "valobashe": "valobasi",
  "balobasi": "valobasi"
};

function convert() {
  let text = document.getElementById("input").value.toLowerCase();
  let words = text.split(" ");

  let result = words.map(word => {

    // 1️⃣ first fix spelling
    if (autoFix[word]) {
      word = autoFix[word];
    }

    // 2️⃣ then convert to Bangla
    if (dict[word]) {
      return dict[word];
    }

    return word;
  }).join(" ");

  document.getElementById("output").value = result;
}
</script>
</body>
</html>
