<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Banglish2Bangla</title>

<style>
  body {
    font-family: Arial;

<body>

<h2>Banglish to Bangla Typing Tool ⚡</h2>

<textarea id="input" placeholder="Type Banglish (ami tomake valobasi)"></textarea><br>

<button onclick="convert()">Convert</button><br>

<textarea id="output" placeholder="Bangla output will show here"></textarea>
<script>
// 📚 Base dictionary (core words)
let dict = {
  "ami": "আমি",
  "tumi": "তুমি",
  "apni": "আপনি",
  "se": "সে",
  "amra": "আমরা",

  "ki": "কি",
  "koro": "করো",
  "kori": "করি",
  "korchi": "করছি",
  "korbo": "করবো",

  "valo": "ভালো",
  "ase": "আছে",
  "nei": "নেই",

  "tomake": "তোমাকে",
  "valobasi": "ভালোবাসি"
};

// 🔧 Smart auto-fix rules
const autoFix = {
  "tomaka": "tomake",
  "tomeke": "tomake",
  "tomke": "tomake",
  "valobashe": "valobasi",
  "balobasi": "valobasi",
  "bhalobashe": "valobasi",
  "valoasi": "valobasi"
};

// 🧠 AI-style fuzzy match (simple distance)
function distance(a, b) {
  let dp = Array.from({ length: a.length + 1 }, () =>
    Array(b.length + 1).fill(0)
  );

  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      let cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }
  return dp[a.length][b.length];
}

// 🔍 find closest match
function findBest(word) {
  let best = word;
  let min = 999;

  for (let key in dict) {
    let d = distance(word, key);
    if (d < min && d <= 2) {
      min = d;
      best = key;
    }
  }
  return best;
}

// 🚀 main convert function
let result = words.map(word => {
  word = word.toLowerCase();
  return dict[word] || word;
}).join(" ");

    // 1️⃣ auto fix spelling
    if (autoFix[word]) {
      word = autoFix[word];
    }

    // 2️⃣ direct match
    if (dict[word]) {
      return dict[word];
    }

    // 3️⃣ smart AI match
    let best = findBest(word);
    if (dict[best]) {
      return dict[best];
    }

    return word;
  }).join(" ");

  document.getElementById("output").value = result;
}
</script>
</body>
</html>
