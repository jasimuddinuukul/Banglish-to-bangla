<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Banglish2Bangla</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    padding: 30px;
    background: #f5f5f5;
  }

  h2 {
    color: #333;
  }

  textarea {
    width: 85%;
    height: 120px;
    font-size: 18px;
    margin: 10px;
    padding: 10px;
  }

  button {
    padding: 10px 25px;
    font-size: 16px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
  }

  button:hover {
    background: #0056b3;
  }
</style>
</head>

<body>

<h2>Banglish to Bangla Typing Tool ⚡</h2>

<textarea id="input" placeholder="Type Banglish (ami tomake valobasi)"></textarea><br>

<button onclick="convert()">Convert</button><br>

<textarea id="output" placeholder="Bangla output will show here"></textarea>
<script>
// 📚 Dictionary
const dict = {
  "ami": "আমি",
  "tumi": "তুমি",
  "apni": "আপনি",
  "se": "সে",

  "ki": "কি",
  "koro": "করো",
  "kori": "করি",
  "korchi": "করছি",

  "valo": "ভালো",
  "bhalo": "ভালো",

  "ase": "আছে",
  "ache": "আছে",

  "tomake": "তোমাকে",

  "valobasi": "ভালোবাসি",
  "bhalobasi": "ভালোবাসি",

  "jai": "যাই",
  "jao": "যাও",

  "bari": "বাড়ি",
  "basha": "বাসা"
};

// 🔧 Auto fix
const autoFix = {
  "tomaka": "tomake",
  "tomeke": "tomake",
  "balobasi": "valobasi"
};

// 🚀 Convert function
function convert() {

  let text = document.getElementById("input").value.toLowerCase();

  let words = text.split(" ");

  let result = words.map(word => {

    // auto fix first
    if (autoFix[word]) {
      word = autoFix[word];
    }

    // dictionary convert
    if (dict[word]) {
      return dict[word];
    }

    // not found
    return word;

  }).join(" ");

  document.getElementById("output").value = result;
}

</script>
</body>
</html>
